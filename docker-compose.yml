services:
  app-009:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8179:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
